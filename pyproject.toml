[project]
name = "risk-pipeline"
version = "0.1.0"
description = "Structured Risk Intelligence: one annual report -> principal-risk records with provenance, and an API to query them"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", {include-group = "nlp"}]
nlp = [
    "en-core-web-sm",
    "spacy>=3.8,<3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared", "src/pipeline", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
